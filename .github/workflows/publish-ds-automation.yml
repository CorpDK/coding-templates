name: Publish DS automation (npm)

# Lockstep CalVer release for @corpdk DAL tooling on npmjs (public).
# Templates stay on Artifactory — see docs/admin/04-npm-publish-ds-automation.md
#
# Live publish: workflow_dispatch on main (dry_run false), npm Trusted Publishing (OIDC).
# Monorepo CI dispatches this workflow after quality + Sonar — not workflow_call
# (npm trusted publishers match this workflow filename, not ci.yml).
# CI creates git tag ds-automation/v<CalVer> and GitHub Release after npm publish.
# PR validation: Monorepo CI dispatches dry_run true on the PR head branch.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use npm publish --dry-run (no upload). Live publish only on main with dry_run false.
        type: boolean
        default: true
      checkout_sha:
        description: Commit to build/publish (Monorepo CI passes orchestrator SHA). Omit for manual dispatch on current ref tip.
        required: false
        type: string
      version:
        description: CalVer override (manual workflow_dispatch only; Monorepo CI reads libraries/dal-core from pinned checkout)
        required: false
        type: string

concurrency:
  group: publish-ds-automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_sha || github.sha }}
          fetch-depth: 2

      # Gate before pnpm/setup-node so early skip does not run setup-node post-cache
      # (pnpm install never runs → cache paths missing → job failure on skip).
      - name: Gate workflow (dispatch mode)
        id: gate
        run: |
          run_job="true"
          live="false"
          ref="${{ github.ref }}"

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "Only workflow_dispatch is supported; skipping."
            run_job="false"
          elif [[ "${{ inputs.dry_run }}" == "false" ]]; then
            if [[ "${ref}" != "refs/heads/main" ]]; then
              echo "Live publish requires refs/heads/main; skipping."
              run_job="false"
            else
              live="true"
              echo "Live publish (workflow_dispatch, dry_run=false)."
            fi
          else
            echo "Dry-run publish (workflow_dispatch, dry_run=true)."
          fi

          echo "run=${run_job}" >> "$GITHUB_OUTPUT"
          echo "live=${live}" >> "$GITHUB_OUTPUT"

      - name: Skip (no qualifying change)
        if: steps.gate.outputs.run != 'true'
        run: echo "Nothing to do."

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./libraries/dal-core/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dry-run mode
        if: steps.gate.outputs.run == 'true'
        id: dry
        run: |
          if [[ "${{ steps.gate.outputs.live }}" == "true" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      - name: Resolve release tag
        if: steps.gate.outputs.run == 'true'
        id: tag
        run: echo "name=ds-automation/v${{ steps.version.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Git tag and release preview (dry-run)
        if: steps.gate.outputs.run == 'true' && steps.dry.outputs.value == 'true'
        run: |
          tag="${{ steps.tag.outputs.name }}"
          echo "[dry-run] Would create tag ${tag} on origin from $(git rev-parse --short HEAD) if absent."
          echo "[dry-run] Would create GitHub Release for ${tag} after successful publish if absent."

      - name: Ensure npm supports trusted publishing
        if: steps.gate.outputs.run == 'true'
        run: npm install -g npm@^11.15.0

      - name: Publish DS automation packages
        if: steps.gate.outputs.run == 'true'
        run: |
          chmod +x .github/scripts/publish-ds-automation.sh
          args=("${{ steps.version.outputs.value }}")
          if [[ "${{ steps.dry.outputs.value }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          .github/scripts/publish-ds-automation.sh "${args[@]}"

      - name: Ensure git tag (live publish)
        if: steps.gate.outputs.run == 'true' && steps.dry.outputs.value != 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping creation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "DS automation CalVer ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release (live publish)
        if: steps.gate.outputs.run == 'true' && steps.dry.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "GitHub Release for ${TAG} already exists; skipping."
            exit 0
          fi
          doc_url="https://github.com/${REPO}/blob/main/docs/admin/04-npm-publish-ds-automation.md"
          notes_file="$(mktemp)"
          {
            echo "## DS automation CalVer ${VERSION}"
            echo ""
            echo "Lockstep \`@corpdk\` packages published to [npmjs](https://www.npmjs.org/) (public):"
            echo ""
            echo "| Package | Version |"
            echo "| ------- | ------- |"
            for pkg in \
              graphql-dsl scalar-zod dal-core pub-sub graphql-input-zod dal-codegen \
              engine-kit graphql-cli-core create-graphql-sdk create-graphql-cli codegen-cli create-ds; do
              echo "| \`@corpdk/${pkg}\` | ${VERSION} |"
            done
            echo ""
            echo "Release process and checklist: [npm publish — DS automation](${doc_url})"
          } > "${notes_file}"
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "DS automation ${VERSION}" \
            --notes-file "${notes_file}"
