name: Publish DS automation (npm)

# Lockstep CalVer release for @corpdk DAL tooling on npmjs (public).
# Templates stay on Artifactory — see docs/admin/04-npm-publish-ds-automation.md
#
# Live publish: push to main only (CalVer bump in dal-core), npm Trusted Publishing (OIDC).
# CI creates git tag ds-automation/v<CalVer> and GitHub Release after npm publish.
# PRs and workflow_dispatch (dry-run default) validate build/tests/packaging without upload.

on:
  push:
    branches:
      - main
    paths:
      - "libraries/dal-core/**"
      - "libraries/dal-codegen/**"
      - "libraries/codegen-cli/**"
      - "libraries/pub-sub/**"
      - "engines/create-ds/**"
      - ".github/workflows/publish-ds-automation.yml"
      - ".github/scripts/publish-ds-automation.sh"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use npm publish --dry-run (no upload). Live publish only on main with dry_run false.
        type: boolean
        default: true
      version:
        description: CalVer to verify (defaults to libraries/dal-core/package.json on checked-out ref)
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "libraries/dal-core/**"
      - "libraries/dal-codegen/**"
      - "libraries/codegen-cli/**"
      - "libraries/pub-sub/**"
      - "engines/create-ds/**"
      - ".github/workflows/publish-ds-automation.yml"
      - ".github/scripts/publish-ds-automation.sh"

concurrency:
  group: publish-ds-automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Gate workflow (CalVer bump / ref)
        id: gate
        run: |
          run_job="true"
          live="false"
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"

          if [[ "${event}" == "pull_request" ]]; then
            echo "Pull request — dry-run only."
          elif [[ "${event}" == "push" && "${ref}" == "refs/heads/main" ]]; then
            curr="$(node -p "require('./libraries/dal-core/package.json').version")"
            before="${{ github.event.before }}"
            prev=""
            if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --depth=1 origin "${before}" 2>/dev/null || true
              prev="$(git show "${before}:libraries/dal-core/package.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" \
                || true)"
            fi
            if [[ -n "${prev}" && "${prev}" == "${curr}" ]]; then
              echo "Main push with unchanged CalVer (${curr}); skipping (no live publish)."
              run_job="false"
            elif [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" && -z "${prev}" ]]; then
              echo "Main push: could not read previous CalVer at ${before}; dry-run only (fail closed)."
            else
              live="true"
              echo "Main push with CalVer ${prev:-<none>} → ${curr} — live publish."
            fi
          elif [[ "${event}" == "workflow_dispatch" ]]; then
            if [[ "${ref}" != "refs/heads/main" ]]; then
              echo "workflow_dispatch is only supported on refs/heads/main; skipping."
              run_job="false"
            elif [[ "${{ inputs.dry_run }}" == "false" ]]; then
              live="true"
              echo "Manual dispatch on main — live publish."
            else
              echo "Manual dispatch on main — dry-run."
            fi
          else
            echo "Unsupported event ${event}; skipping."
            run_job="false"
          fi

          echo "run=${run_job}" >> "$GITHUB_OUTPUT"
          echo "live=${live}" >> "$GITHUB_OUTPUT"

      - name: Skip (no qualifying change)
        if: steps.gate.outputs.run != 'true'
        run: echo "Nothing to do."

      - name: Resolve release version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./libraries/dal-core/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dry-run mode
        if: steps.gate.outputs.run == 'true'
        id: dry
        run: |
          if [[ "${{ steps.gate.outputs.live }}" == "true" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      - name: Resolve release tag
        if: steps.gate.outputs.run == 'true'
        id: tag
        run: echo "name=ds-automation/v${{ steps.version.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Git tag and release preview (dry-run)
        if: steps.gate.outputs.run == 'true' && steps.dry.outputs.value == 'true'
        run: |
          tag="${{ steps.tag.outputs.name }}"
          echo "[dry-run] Would create tag ${tag} on origin from $(git rev-parse --short HEAD) if absent."
          echo "[dry-run] Would create GitHub Release for ${tag} after successful publish if absent."

      - name: Ensure npm supports trusted publishing
        if: steps.gate.outputs.run == 'true'
        run: npm install -g npm@^11.15.0

      - name: Publish DS automation packages
        if: steps.gate.outputs.run == 'true'
        run: |
          chmod +x .github/scripts/publish-ds-automation.sh
          args=("${{ steps.version.outputs.value }}")
          if [[ "${{ steps.dry.outputs.value }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          .github/scripts/publish-ds-automation.sh "${args[@]}"

      - name: Ensure git tag (live publish)
        if: steps.gate.outputs.run == 'true' && steps.dry.outputs.value != 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping creation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "DS automation CalVer ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release (live publish)
        if: steps.gate.outputs.run == 'true' && steps.dry.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "GitHub Release for ${TAG} already exists; skipping."
            exit 0
          fi
          doc_url="https://github.com/${REPO}/blob/main/docs/admin/04-npm-publish-ds-automation.md"
          notes_file="$(mktemp)"
          {
            echo "## DS automation CalVer ${VERSION}"
            echo ""
            echo "Lockstep \`@corpdk\` packages published to [npmjs](https://www.npmjs.org/) (public):"
            echo ""
            echo "| Package | Version |"
            echo "| ------- | ------- |"
            echo "| \`@corpdk/dal-core\` | ${VERSION} |"
            echo "| \`@corpdk/pub-sub\` | ${VERSION} |"
            echo "| \`@corpdk/codegen-cli\` | ${VERSION} |"
            echo "| \`@corpdk/dal-codegen\` | ${VERSION} |"
            echo "| \`@corpdk/create-ds\` | ${VERSION} |"
            echo ""
            echo "Release process and checklist: [npm publish — DS automation](${doc_url})"
          } > "${notes_file}"
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "DS automation ${VERSION}" \
            --notes-file "${notes_file}"
