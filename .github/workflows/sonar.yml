name: SonarQube Analysis

# Runs DAL unit tests with coverage, then SonarCloud scan. Repo-specific
# config (paths, exclusions, project key, lcov paths) lives in sonar-project.properties.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @corpdk/dal-core build
      - run: pnpm --filter @corpdk/dal-codegen build
      - run: pnpm --filter @corpdk/dal-core test:coverage
      - run: pnpm --filter @corpdk/dal-codegen test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
