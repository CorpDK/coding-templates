name: DAL

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @corpdk/dal-core build
      - run: pnpm --filter @corpdk/pub-sub build
      - run: pnpm --filter @corpdk/dal-codegen build

      - run: pnpm --filter @corpdk/dal-core test
      - run: pnpm --filter @corpdk/dal-codegen test
      - run: pnpm --filter @corpdk/ds dal:codegen
      - run: pnpm --filter @corpdk/ds build
      - run: pnpm --filter @corpdk/ds entity:lint
