# SonarQube / SonarCloud configuration for @corpdk/coding-templates
#
# Project identity
sonar.projectKey=CorpDK_coding-templates
sonar.projectName=coding-templates
sonar.organization=corpdk

# What to analyze
sonar.sources=engines,libraries,packages,templates
sonar.tests=\
  libraries/dal-core/src/__tests__,\
  libraries/dal-codegen/src/generators/__tests__,\
  templates/ui-showcase/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# What to ignore — build output, vendored deps, generated code, lockfiles
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/storybook-static/**,\
  **/.storybook-static/**,\
  **/coverage/**,\
  **/__generated__/**,\
  **/generated/**,\
  **/__tests__/fixtures/**,\
  **/__tests__/tmp-generated*/**,\
  **/*.fixture.ts,\
  **/*.generated.ts,\
  **/*.generated.tsx,\
  **/prisma/migrations/**,\
  **/drizzle/migrations/**,\
  **/*.d.ts,\
  pnpm-lock.yaml

sonar.test.exclusions=**/node_modules/**,**/dist/**

# Coverage metric applies to DAL libraries (unit tests emit lcov); templates/engines/packages
# are integration-tested elsewhere and are excluded from the Sonar coverage denominator.
sonar.coverage.exclusions=\
  engines/**,\
  packages/**,\
  templates/**,\
  **/cli.ts,\
  **/lint-cli.ts

# Coverage — emitted by `pnpm --filter @corpdk/dal-{core,codegen} test:coverage` in CI
sonar.javascript.lcov.reportPaths=\
  libraries/dal-core/coverage/lcov.info,\
  libraries/dal-codegen/coverage/lcov.info
sonar.typescript.lcov.reportPaths=\
  libraries/dal-core/coverage/lcov.info,\
  libraries/dal-codegen/coverage/lcov.info

sonar.sourceEncoding=UTF-8
