# SonarQube / SonarCloud configuration for @corpdk/coding-templates
#
# Project identity
sonar.projectKey=CorpDK_coding-templates
sonar.projectName=coding-templates
sonar.organization=corpdk

# What to analyze
sonar.sources=engines,libraries,packages,templates
sonar.tests=\
  libraries/dal-core/src/__tests__,\
  libraries/dal-codegen/src/__tests__,\
  libraries/dal-codegen/src/generators/__tests__,\
  libraries/graphql-input-zod/src/codegen/__tests__,\
  libraries/scalar-zod/src/__tests__,\
  libraries/pub-sub/src/__tests__,\
  libraries/graphql-dsl/test,\
  templates/ui-showcase/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,libraries/graphql-dsl/test/helpers/**

# What to ignore — build output, vendored deps, generated code, lockfiles
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/storybook-static/**,\
  **/.storybook-static/**,\
  **/coverage/**,\
  **/__generated__/**,\
  **/generated/**,\
  **/__tests__/fixtures/**,\
  **/__tests__/tmp-generated*/**,\
  **/*.fixture.ts,\
  **/*.generated.ts,\
  **/*.generated.tsx,\
  **/prisma/migrations/**,\
  **/drizzle/migrations/**,\
  **/*.d.ts,\
  pnpm-lock.yaml

sonar.test.exclusions=**/node_modules/**,**/dist/**

# Bundled DS template copy (mirrors templates/ds for published create-ds); not authored twice.
# create-graphql-sdk init/args/upgrade mirror create-ds engine-kit pattern (doc 15 §11).
sonar.cpd.exclusions=\
  engines/create-ds/canonical/**,\
  engines/create-graphql-sdk/src/args-helpers.ts,\
  engines/create-graphql-sdk/src/init.ts,\
  engines/create-graphql-sdk/src/upgrade.ts,\
  libraries/graphql-dsl/src/codegen/render/common/comment.ts,\
  libraries/graphql-dsl/src/codegen/render/common/excludedTypes.ts,\
  libraries/graphql-dsl/src/codegen/render/common/renderTyping.ts,\
  libraries/graphql-dsl/src/codegen/render/common/support.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/objectType.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/renderRequestTypes.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/requestTypeName.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/unionType.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/objectType.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/renderTypeMap.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/scalarType.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/support.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/unionType.ts,\
  libraries/graphql-dsl/src/runtime/linkTypeMap.ts,\
  libraries/graphql-dsl/src/runtime/types.ts

# Coverage metric applies to DAL libraries (unit tests emit lcov); templates/engines/packages
# are integration-tested elsewhere and are excluded from the Sonar coverage denominator.
# B0 generator scaffolds (doc 15 §4.4) and P1a libraries without Sonar lcov stay excluded; @corpdk/graphql-dsl inherited paths in UPSTREAM.md.
sonar.coverage.exclusions=\
  engines/**,\
  packages/**,\
  templates/**,\
  libraries/ws-stub/**,\
  libraries/graphql-ws-stub/**,\
  libraries/scalar-zod/**,\
  libraries/graphql-dsl/src/codegen/render/common/comment.ts,\
  libraries/graphql-dsl/src/codegen/render/common/excludedTypes.ts,\
  libraries/graphql-dsl/src/codegen/render/common/renderTyping.ts,\
  libraries/graphql-dsl/src/codegen/render/common/support.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/objectType.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/renderRequestTypes.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/requestTypeName.ts,\
  libraries/graphql-dsl/src/codegen/render/requestTypes/unionType.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/objectType.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/renderTypeMap.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/scalarType.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/support.ts,\
  libraries/graphql-dsl/src/codegen/render/typeMap/unionType.ts,\
  libraries/graphql-dsl/src/runtime/linkTypeMap.ts,\
  libraries/graphql-dsl/src/runtime/types.ts,\
  libraries/graphql-dsl/scripts/**,\
  libraries/graphql-dsl/test/helpers/**,\
  libraries/graphql-input-zod/**,\
  libraries/graphql-cli-core/**,\
  libraries/engine-kit/**,\
  libraries/dal-core/src/scalars.ts,\
  libraries/dal-core/src/scalar-zod.ts,\
  libraries/dal-core/src/guild-scalars.ts,\
  libraries/dal-core/src/pg-bounds.ts,\
  libraries/dal-core/src/pg-interval.ts,\
  **/cli.ts,\
  **/lint-cli.ts,\
  **/vitest.config.ts

# Coverage — emitted by `pnpm --filter @corpdk/{dal-core,dal-codegen,pub-sub,graphql-dsl} test:coverage` in CI
sonar.javascript.lcov.reportPaths=\
  libraries/dal-core/coverage/lcov.info,\
  libraries/dal-codegen/coverage/lcov.info,\
  libraries/pub-sub/coverage/lcov.info,\
  libraries/graphql-dsl/coverage/lcov.info
sonar.typescript.lcov.reportPaths=\
  libraries/dal-core/coverage/lcov.info,\
  libraries/dal-codegen/coverage/lcov.info,\
  libraries/pub-sub/coverage/lcov.info,\
  libraries/graphql-dsl/coverage/lcov.info

sonar.sourceEncoding=UTF-8
